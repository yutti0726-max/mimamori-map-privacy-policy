<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Privacy Policy / プライバシーポリシー</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
<h1>Privacy Policy</h1>
<p>Choose a language / 言語を選んでください / 请选择语言 / 請選擇語言</p>
<ul><li><a href="en.html" hreflang="en" lang="en">English</a></li><li><a href="ja.html" hreflang="ja" lang="ja">日本語</a></li><li><a href="zh-CN.html" hreflang="zh-Hans" lang="zh-Hans">简体中文</a></li><li><a href="zh-TW.html" hreflang="zh-Hant" lang="zh-Hant">繁體中文</a></li></ul>
</main>
<script>
(function(){var l=((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase();var t='en';
if(l.indexOf('ja')===0){t='ja';}else if(l.indexOf('zh')===0){t=/hant|tw|hk|mo/.test(l)?'zh-TW':'zh-CN';}
location.replace(t+'.html');})();
</script>
</body>
</html>
